name: fastapi-vehiculos

services:
  fastapi-db:
    image: postgres:15
    container_name: fastapi-db-vehiculos
    environment:
      POSTGRES_USER: quevedo
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: vehiculosdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quevedo -d vehiculosdb"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: always

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app-vehiculos
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      fastapi-db:
        condition: service_healthy

volumes:
  db_data:  
  